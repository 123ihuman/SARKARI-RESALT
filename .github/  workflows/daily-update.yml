name: Daily Sarkari Update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests google-generativeai

      - name: Run updater
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update.py

      - name: Commit changes
        run: |
          git config user.name "Bot"
          git config user.email "bot@bot.com"
          git pull --rebase origin main || true
          git add .
          git commit -m "Daily update $(date +%F)" || exit 0
          git push
